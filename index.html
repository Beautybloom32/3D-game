<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>School Life 3D</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87bde5;
    font-family:Arial,sans-serif;
}

#game{
    width:100%;
    height:100%;
    position:relative;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
}

#topBar{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:10;
    pointer-events:none;
}

.hud{
    color:white;
    background:rgba(0,0,0,.65);
    padding:11px 16px;
    border-radius:12px;
    font-size:14px;
    backdrop-filter:blur(8px);
}

#stats{
    position:absolute;
    top:65px;
    left:15px;
    color:white;
    background:rgba(0,0,0,.55);
    padding:8px 13px;
    border-radius:10px;
    font-size:13px;
    z-index:10;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:30px;
    width:135px;
    height:135px;
    border-radius:50%;
    background:rgba(255,255,255,.13);
    border:2px solid rgba(255,255,255,.35);
    z-index:20;
    touch-action:none;
}

#stick{
    position:absolute;
    width:58px;
    height:58px;
    left:36px;
    top:36px;
    border-radius:50%;
    background:rgba(255,255,255,.7);
    box-shadow:0 3px 14px rgba(0,0,0,.3);
}

#buttons{
    position:absolute;
    right:25px;
    bottom:35px;
    display:flex;
    gap:13px;
    z-index:20;
}

.gameButton{
    width:70px;
    height:70px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(0,0,0,.68);
    color:white;
    font-weight:bold;
    touch-action:none;
}

.gameButton:active{
    transform:scale(.92);
}

#help{
    position:absolute;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.58);
    color:white;
    padding:8px 14px;
    border-radius:10px;
    font-size:12px;
    z-index:10;
}

#loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    background:rgba(0,0,0,.45);
    z-index:50;
    font-size:18px;
}

@media(max-width:600px){

    #help{
        display:none;
    }

    #joystick{
        left:15px;
        bottom:20px;
    }

    #buttons{
        right:15px;
        bottom:25px;
    }

    .hud{
        font-size:12px;
        padding:9px 11px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="topBar">

        <div class="hud">
            🏫 SCHOOL LIFE 3D
        </div>

        <div class="hud" id="mission">
            Mission: Explore the school
        </div>

    </div>

    <div id="stats">
        ❤️ Health: <span id="health">100</span>
        &nbsp; 🪙 Coins: <span id="coins">0</span>
    </div>

    <div id="loading">
        Loading School Life 3D...
    </div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="buttons">

        <button class="gameButton" id="jumpButton">
            JUMP
        </button>

        <button class="gameButton" id="talkButton">
            TALK
        </button>

        <button class="gameButton" id="runButton">
            RUN
        </button>

    </div>

    <div id="help">
        WASD / Arrow Keys • SPACE = Jump • E = Talk • SHIFT = Run
    </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* =========================================
   SCENE
========================================= */

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x87bde5);

scene.fog =
new THREE.Fog(
    0x87bde5,
    60,
    180
);


/* =========================================
   CAMERA
========================================= */

const camera =
new THREE.PerspectiveCamera(
    60,
    innerWidth / innerHeight,
    .1,
    400
);

camera.position.set(
    0,
    5,
    9
);


/* =========================================
   RENDERER
========================================= */

const renderer =
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

document
.getElementById("game")
.prepend(renderer.domElement);


/* =========================================
   LIGHTS
========================================= */

const hemi =
new THREE.HemisphereLight(
    0xdff3ff,
    0x40522e,
    2.2
);

scene.add(hemi);


const sun =
new THREE.DirectionalLight(
    0xffffff,
    3
);

sun.position.set(
    -40,
    70,
    30
);

sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

sun.shadow.camera.left=-100;
sun.shadow.camera.right=100;
sun.shadow.camera.top=100;
sun.shadow.camera.bottom=-100;

scene.add(sun);


/* =========================================
   MATERIALS
========================================= */

const grass =
new THREE.MeshStandardMaterial({
    color:0x5f9651
});

const road =
new THREE.MeshStandardMaterial({
    color:0x3d4248
});

const building =
new THREE.MeshStandardMaterial({
    color:0xe8dfd0
});

const roof =
new THREE.MeshStandardMaterial({
    color:0x8e4249
});

const windowMat =
new THREE.MeshStandardMaterial({
    color:0x67badb,
    roughness:.2
});

const white =
new THREE.MeshStandardMaterial({
    color:0xf4f1e8
});

const dark =
new THREE.MeshStandardMaterial({
    color:0x20242b
});

const tree =
new THREE.MeshStandardMaterial({
    color:0x39783f
});

const trunk =
new THREE.MeshStandardMaterial({
    color:0x60432e
});


/* =========================================
   WORLD HELPERS
========================================= */

function box(
    x,y,z,
    w,h,d,
    material
){

    const mesh =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            w,h,d
        ),
        material
    );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    scene.add(mesh);

    return mesh;
}


/* =========================================
   GROUND
========================================= */

box(
    0,-.3,0,
    220,.6,220,
    grass
);


/* =========================================
   ROADS
========================================= */

box(
    0,.02,8,
    220,.08,12,
    road
);

box(
    0,.03,-35,
    220,.08,10,
    road
);

for(
    let x=-100;
    x<100;
    x+=14
){

    box(
        x,.09,8,
        7,.03,.35,
        white
    );

}

for(
    let x=-100;
    x<100;
    x+=14
){

    box(
        x,.09,-35,
        7,.03,.35,
        white
    );

}


/* =========================================
   BUILDING
========================================= */

function createBuilding(
    x,z,
    width,
    depth,
    height,
    name
){

    const group =
    new THREE.Group();

    const body =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            height,
            depth
        ),
        building
    );

    body.position.y=
    height/2;

    body.castShadow=true;
    body.receiveShadow=true;

    group.add(body);


    const roofMesh =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            width+.5,
            .5,
            depth+.5
        ),
        roof
    );

    roofMesh.position.y=
    height+.25;

    roofMesh.castShadow=true;

    group.add(roofMesh);


    /* WINDOWS */

    for(
        let i=-1;
        i<=1;
        i++
    ){

        const win1 =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width*.13,
                height*.19,
                .1
            ),
            windowMat
        );

        win1.position.set(
            i*width*.28,
            height*.62,
            -depth/2-.05
        );

        group.add(win1);


        const win2 =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                width*.13,
                height*.19,
                .1
            ),
            windowMat
        );

        win2.position.set(
            i*width*.28,
            height*.34,
            -depth/2-.05
        );

        group.add(win2);

    }


    /* ENTRANCE */

    const door =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            2.8,
            height*.48,
            .2
        ),
        dark
    );

    door.position.set(
        0,
        height*.24,
        -depth/2-.1
    );

    group.add(door);

    group.position.set(
        x,0,z
    );

    scene.add(group);

    return group;
}


/* SCHOOL */

createBuilding(
    0,-55,
    42,20,12,
    "Main School"
);


/* GYM */

createBuilding(
    -42,-45,
    18,15,8,
    "Gym"
);


/* CAFETERIA */

createBuilding(
    42,-45,
    20,15,8,
    "Cafeteria"
);


/* DORM */

createBuilding(
    42,15,
    20,15,8,
    "Dormitory"
);


/* LIBRARY */

createBuilding(
    -42,15,
    20,15,8,
    "Library"
);


/* =========================================
   TREES
========================================= */

function createTree(x,z){

    const t =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            .5,.65,4,10
        ),
        trunk
    );

    t.position.set(
        x,2,z
    );

    t.castShadow=true;

    scene.add(t);


    const crown =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            2.7,
            20,
            16
        ),
        tree
    );

    crown.position.set(
        x,5,z
    );

    crown.castShadow=true;

    scene.add(crown);
}


for(
    let x=-90;
    x<=90;
    x+=15
){

    createTree(x,-5);
    createTree(x,38);

}

for(
    let z=-70;
    z<=55;
    z+=15
){

    createTree(-90,z);
    createTree(90,z);

}


/* =========================================
   PLAYER
========================================= */

const player =
new THREE.Group();

scene.add(player);

player.position.set(
    0,0,5
);


/*
 IMPORTANT:

 Put your actual GLB character here:

 assets/player.glb

 GitHub structure:

 index.html
 assets/
     player.glb
*/


const loader =
new GLTFLoader();

let model=null;
let mixer=null;
let animations=[];


/* =========================================
   FALLBACK CHARACTER
   ONLY USED UNTIL player.glb IS ADDED
========================================= */

function fallbackCharacter(){

    const group =
    new THREE.Group();


    const body =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .48,
            1.05,
            8,
            16
        ),
        new THREE.MeshStandardMaterial({
            color:0x315d9b
        })
    );

    body.position.y=1.55;

    group.add(body);


    const head =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .46,
            24,
            18
        ),
        new THREE.MeshStandardMaterial({
            color:0xe6ad89
        })
    );

    head.position.y=2.75;

    group.add(head);


    const hair =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .49,
            24,
            16
        ),
        new THREE.MeshStandardMaterial({
            color:0x211914
        })
    );

    hair.position.y=2.98;

    hair.scale.y=.65;

    group.add(hair);


    return group;
}


const fallback =
fallbackCharacter();

player.add(fallback);


/* =========================================
   LOAD REAL CHARACTER
========================================= */

loader.load(
    "assets/player.glb",

    function(gltf){

        player.remove(fallback);

        model =
        gltf.scene;

        model.traverse(
            function(object){

                if(object.isMesh){

                    object.castShadow=true;
                    object.receiveShadow=true;

                }

            }
        );


        model.scale.set(
            1,1,1
        );


        player.add(model);

        animations =
        gltf.animations || [];


        if(animations.length){

            mixer =
            new THREE.AnimationMixer(
                model
            );

            const action =
            mixer.clipAction(
                animations[0]
            );

            action.play();

        }

    },

    undefined,

    function(error){

        console.log(
            "player.glb not found yet. Fallback character active."
        );

    }
);


/* =========================================
   NPC SYSTEM
========================================= */

const npcs=[];


function createNPC(
    x,z
){

    const npc =
    fallbackCharacter();

    npc.position.set(
        x,0,z
    );

    npc.scale.set(
        .9,.9,.9
    );

    scene.add(npc);

    npcs.push({
        object:npc,
        target:new THREE.Vector3(
            x,
            0,
            z
        ),
        timer:0
    });

    return npc;
}


createNPC(-10,-5);
createNPC(12,-10);
createNPC(20,2);
createNPC(-20,4);
createNPC(7,25);
createNPC(-8,30);


/* =========================================
   CONTROLS
========================================= */

const keys={};

window.addEventListener(
    "keydown",
    e=>{

        keys[e.key.toLowerCase()]=true;

        if(e.code==="Space"){
            e.preventDefault();
            jump();
        }

        if(
            e.key.toLowerCase()==="e"
        ){
            talk();
        }

    }
);

window.addEventListener(
    "keyup",
    e=>{
        keys[e.key.toLowerCase()]=false;
    }
);


/* =========================================
   JOYSTICK
========================================= */

const joystick =
document.getElementById(
    "joystick"
);

const stick =
document.getElementById(
    "stick"
);

let joyX=0;
let joyY=0;

function moveStick(e){

    const r=
    joystick.getBoundingClientRect();

    let dx=
    e.clientX-
    (r.left+r.width/2);

    let dy=
    e.clientY-
    (r.top+r.height/2);

    const max=43;

    const distance=
    Math.hypot(dx,dy);

    if(distance>max){

        dx=
        dx/distance*max;

        dy=
        dy/distance*max;

    }

    joyX=dx/max;
    joyY=dy/max;

    stick.style.transform=
    `translate(${dx}px,${dy}px)`;
}


function resetStick(){

    joyX=0;
    joyY=0;

    stick.style.transform="";
}


joystick.addEventListener(
    "pointerdown",
    e=>{

        joystick.setPointerCapture(
            e.pointerId
        );

        moveStick(e);

    }
);

joystick.addEventListener(
    "pointermove",
    e=>{

        if(e.buttons)
            moveStick(e);

    }
);

joystick.addEventListener(
    "pointerup",
    resetStick
);

joystick.addEventListener(
    "pointercancel",
    resetStick
);


/* =========================================
   RUN
========================================= */

let running=false;

const runButton =
document.getElementById(
    "runButton"
);

runButton.addEventListener(
    "pointerdown",
    ()=>{
        running=true;
    }
);

runButton.addEventListener(
    "pointerup",
    ()=>{
        running=false;
    }
);

window.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="Shift"
        )
            running=true;

    }
);

window.addEventListener(
    "keyup",
    e=>{

        if(
            e.key==="Shift"
        )
            running=false;

    }
);


/* =========================================
   JUMP
========================================= */

let velocityY=0;
let grounded=true;

function jump(){

    if(!grounded)
        return;

    velocityY=.17;
    grounded=false;
}


document
.getElementById("jumpButton")
.addEventListener(
    "pointerdown",
    jump
);


/* =========================================
   TALK
========================================= */

function talk(){

    let nearest=null;
    let distance=999;

    for(
        const npc of npcs
    ){

        const d=
        npc.object.position.distanceTo(
            player.position
        );

        if(d<distance){

            distance=d;
            nearest=npc;

        }

    }


    const mission=
    document.getElementById(
        "mission"
    );


    if(
        nearest &&
        distance<5
    ){

        mission.textContent=
        'Student: "Hi! Welcome to school!"';

    }
    else{

        mission.textContent=
        "Mission: Find a student";

    }

}


document
.getElementById("talkButton")
.addEventListener(
    "pointerdown",
    talk
);


/* =========================================
   GAME LOOP
========================================= */

const clock=
new THREE.Clock();

const movement=
new THREE.Vector3();

function animate(){

    requestAnimationFrame(
        animate
    );

    const delta=
    Math.min(
        clock.getDelta(),
        .033
    );


    /* PLAYER INPUT */

    let x=
        (keys["d"]?1:0) -
        (keys["a"]?1:0) +
        joyX;


    let z=
        (keys["s"]?1:0) -
        (keys["w"]?1:0) +
        joyY;


    const len=
    Math.hypot(x,z);


    if(len>1){

        x/=len;
        z/=len;

    }


    const moving=
    Math.abs(x)+Math.abs(z)>.08;


    if(moving){

        movement.set(
            x,
            0,
            z
        );

        movement.normalize();


        const speed=
        running ? 13 : 7;


        player.position.addScaledVector(
            movement,
            speed*delta
        );


        player.rotation.y=
        Math.atan2(
            x,
            z
        );


        /* basic fallback animation */

        if(!model){

            const walk=
            Math.sin(
                clock.elapsedTime*
                (running?14:9)
            )*.35;

            fallback.rotation.y=0;

            fallback.children.forEach(
                child=>{
                    if(
                        child.geometry &&
                        child.geometry.type===
                        "CapsuleGeometry"
                    ){
                        child.rotation.x=
                        walk;
                    }
                }
            );

        }

    }


    /* JUMP */

    velocityY-=
    delta*.55;

    player.position.y+=
    velocityY;


    if(
        player.position.y<=0
    ){

        player.position.y=0;
        velocityY=0;
        grounded=true;

    }


    /* LIMIT */

    player.position.x=
    THREE.MathUtils.clamp(
        player.position.x,
        -105,
        105
    );

    player.position.z=
    THREE.MathUtils.clamp(
        player.position.z,
        -100,
        85
    );


    /* NPC SIMPLE AI */

    npcs.forEach(
        npc=>{

            npc.timer+=delta;

            if(
                npc.timer>3
            ){

                npc.timer=0;

                npc.target.set(
                    npc.object.position.x+
                    (Math.random()-.5)*18,
                    0,
                    npc.object.position.z+
                    (Math.random()-.5)*18
                );

            }


            const direction=
            new THREE.Vector3()
            .subVectors(
                npc.target,
                npc.object.position
            );

            direction.y=0;


            if(
                direction.length()>.5
            ){

                direction.normalize();

                npc.object.position.addScaledVector(
                    direction,
                    delta*1.5
                );

                npc.object.rotation.y=
                Math.atan2(
                    direction.x,
                    direction.z
                );

            }

        }
    );


    /* ANIMATION MIXER */

    if(mixer){

        mixer.update(delta);

    }


    /* CAMERA */

    const targetCamera=
    new THREE.Vector3(
        player.position.x,
        player.position.y+4.8,
        player.position.z+8.5
    );

    camera.position.lerp(
        targetCamera,
        .08
    );


    const targetLook=
    new THREE.Vector3(
        player.position.x,
        player.position.y+1.7,
        player.position.z
    );

    camera.lookAt(
        targetLook
    );


    renderer.render(
        scene,
        camera
    );

}


/* =========================================
   START
========================================= */

document
.getElementById("loading")
.style.display="none";

animate();


/* =========================================
   RESIZE
========================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
        innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
